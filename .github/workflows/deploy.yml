name: CD — Deploy to Stage Server

on:
  push:
    branches:
      - version-1
      - stage

# Prevent multiple deploys running at same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Run CI first ─────────────────────────────
  ci:
    name: Test & Scan (pre-deploy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install uv
          uv pip install -r requirements.txt --system
          uv pip install pytest pytest-asyncio httpx --system

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test --if-present

  # ── Job 2: Deploy (only if CI passes) ──────────────
  deploy:
    name: Deploy to Stage Server
    runs-on: ubuntu-latest
    needs: ci       # waits for ci job to pass
    environment: stage   # enables manual approval if configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/home/hmsadmin/projects/Billing_Software/frontend/dist"
          strip_components: 2

      - name: Deploy backend & reload services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "── Pulling latest code ──"
            cd ~/projects/Billing_Software
            git pull origin version-1

            echo "── Installing backend deps ──"
            source backend/venv/bin/activate
            export PATH="$HOME/.local/bin:$PATH"
            uv pip install -r backend/requirements.txt

            echo "── Applying database migrations ──"
            # MUST run before restarting the backend: the new code's ORM models may
            # reference columns/tables this release adds. Skipping this leaves the DB
            # behind the code and every query on the changed table 500s ("UndefinedColumn").
            # run_migration.py is idempotent (ADD COLUMN/TABLE IF NOT EXISTS + guarded backfills).
            (cd backend && python run_migration.py)

            echo "── Fixing permissions ──"
            chmod -R 755 ~/projects/Billing_Software/frontend/dist

            echo "── Restarting services ──"
            sudo systemctl restart billing-backend
            sleep 3
            sudo systemctl reload nginx

            echo "── Verifying ──"
            sudo systemctl status billing-backend --no-pager | head -5

            echo "✅ Deployment complete"

      # ── Notify success ─────────────────────────────
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.NOTIFY_EMAIL_FROM }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "✅ Deploy Success — ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            Deployment completed successfully ✅

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}

            App URL: http://139.59.62.156:8080

            View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── Notify failure ─────────────────────────────
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.NOTIFY_EMAIL_FROM }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "❌ Deploy Failed — ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            Deployment FAILED ❌

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}